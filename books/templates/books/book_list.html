<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HeartBooks | Books</title>
</head>
<body>
    <h1>Books List</h1>
    {% for book in object_list %}
    <h2>{{book.title}}</h2>
    <p>{{book.author}}</p>
    <img 
    src="{{ book.image.url }}" 
    alt="{{book.title}} | Book Cover" 
    width="15%"
    />
    <p>{{book.published}}</p>
    {% endfor %}
</body>
</html>
